<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060d0b">
<title>ХимЛаб ULTRA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#060d0b;color:#ecfdf5;font-family:system-ui,sans-serif;padding:6px;min-height:100vh}
#bg{position:fixed;inset:0;z-index:0}
#fx{position:fixed;inset:0;z-index:9;pointer-events:none}
.card{position:relative;z-index:1;max-width:420px;margin:0 auto;background:#0f1f1bf2;border-radius:12px;padding:10px;border:1px solid #1e3a32}
.crazy .card{animation:hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:4px}
.title{font-size:14px;font-weight:bold;color:#10b981;user-select:none}
.badge{font-size:11px;font-weight:bold;color:#34d399;background:#060d0b;padding:2px 6px;border-radius:5px;border:1px solid #1e3a32}
.ib{background:#060d0b;border:1px solid #1e3a32;padding:2px 5px;font-size:12px;border-radius:5px}
.bar{height:7px;background:#060d0b;border-radius:4px;overflow:hidden;border:1px solid #1e3a32}
.bar i{display:block;height:100%;width:0;transition:width .4s}
#xpb{background:linear-gradient(90deg,#10b981,#38bdf8)}
#bb{background:linear-gradient(90deg,#f87171,#fb923c)}
.lab{font-size:10px;color:#6ee7b7;margin:4px 0 2px;display:flex;justify-content:space-between}
.box{background:#060d0b;border-radius:8px;padding:8px;margin:8px 0;border:1px solid #132a24}
.box.alarm{background:#059669;animation:al .5s infinite}
@keyframes al{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-.6deg)}75%{transform:translateX(4px) rotate(.6deg)}}
.shake{animation:al .1s 6}
.quote{font-size:13px;line-height:1.4;margin-bottom:8px;color:#d1fae5}
.row{display:flex;gap:4px;margin-bottom:6px}
button{border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-family:inherit}
button:active{transform:scale(.93)}
.m-btn{flex:1;background:#0f1f1b;color:#a7f3d0;border:1px solid #1e3a32;padding:8px 2px;font-size:11px}
.t-btn{flex:1;background:#10b981;color:#060d0b;padding:8px;font-size:12px}
.ack-btn{width:100%;background:#ecfdf5;color:#065f46;padding:10px;font-size:13px;display:none}
.tab{flex:1;background:#060d0b;color:#6ee7b7;padding:8px 0;font-size:10px}
