<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Учёба</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1120;color:#f8fafc;font-family:sans-serif;padding:4px}
.card{max-width:420px;margin:0 auto;background:#1e293b;border-radius:12px;padding:10px;border:1px solid #334155}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:13px;font-weight:bold;color:#38bdf8}
.badge{font-size:11px;font-weight:bold;color:#38bdf8;background:#0f172a;padding:2px 6px;border-radius:5px}
.box{background:#0f172a;border-radius:8px;padding:8px;margin-bottom:8px}
.box.alarm{background:#0284c7}
.quote{font-size:12px;line-height:1.3;margin-bottom:8px}
.row{display:flex;gap:4px;margin-bottom:6px}
button{border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.m-btn{flex:1;background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:6px 2px;font-size:11px}
.t-btn{flex:1;background:#38bdf8;color:#0f172a;padding:6px;font-size:11px}
.ack-btn{width:100%;background:#fff;color:#0284c7;padding:6px;font-size:11px;display:none}
.tab{flex:1;background:#0f172a;color:#94a3b8;padding:6px;font-size:11px}
.tab.active{background:#38bdf8;color:#0f172a}
input{background:#0f172a;border:1px solid #334155;color:#fff;padding:6px;border-radius:6px;font-size:12px;min-width:0}
.in-time{width:50px;text-align:center}
.in-text{flex:1}
.add-btn{background:#34d399;color:#0f172a;width:28px;font-size:16px}
ul{list-style:none;max-height:150px;overflow-y:auto}
li{display:flex;justify-content:space-between;align-items:center;padding:6px;background:#0f172a;border-radius:6px;margin-bottom:4px;font-size:12px;border-left:3px solid #38bdf8}
li.done{opacity:0.4;text-decoration:line-through}
.t-info{flex:1;display:flex;gap:6px;cursor:pointer;overflow:hidden}
.del{background:none;color:#f87171;font-size:13px;padding:0 4px}
textarea{width:100%;height:120px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#fff;padding:8px;font-size:12px;resize:none}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div class="title">📚 Учёба-Трекер</div>
<div><span class="badge" id="prog">0/0</span> <span class="badge" id="clk">00:00</span></div>
</div>
<div class="box" id="mbox">
<div class="quote" id="q">Выбери состояние, если застрял с учёбой.</div>
<div class="row" id="mbtns">
<button class="m-btn" onclick="mood(0)">😴 Лень</button>
<button class="m-btn" onclick="mood(1)">📱 Залип</button>
<button class="m-btn" onclick="mood(2)">🤯 Сложно</button>
</div>
<div class="row" id="trow" style="display:none">
<button class="t-btn" onclick="timer(300)">⏱ 5 мин</button>
<button class="t-btn" style="background:#818cf8" onclick="timer(1500)">🍅 25 мин</button>
</div>
<button class="ack-btn" id="abtn" onclick="ack()">✅ Сажусь учить!</button>
</div>
<div class="row">
<button class="tab active" id="tp" onclick="tab(0)">📅 План</button>
<button class="tab" id="tn" onclick="tab(1)">📝 Заметки</button>
</div>
<div id="vp">
<div class="row">
<input class="in-time" id="tt" value="12:00" maxlength="5">
<input class="in-text" id="ti" placeholder="Предмет или ДЗ...">
<button class="add-btn" onclick="add()">+</button>
</div>
<ul id="list"></ul>
</div>
<div id="vn" style="display:none">
<textarea id="nb" placeholder="Запиши сюда ДЗ, страницы или формулы..." oninput="localStorage.setItem('sn',this.value)"></textarea>
</div>
</div>
<script>
var rep=[
["Учебник сам себя не прочтёт. Открой тему всего на 5 минут!","Сделай один номер или прочитай параграф, потом отдохнёшь."],
["В ленте мемов диплом не выдают! Убирай телефон на 25 минут.","Закрывай соцсети и жми таймер ниже."],
["Разбей тему: сначала просто выпиши формулы или термины.","Сделай самый лёгкий кусок задания, чтобы сдвинуться с места."]
];
var tasks=JSON.parse(localStorage.getItem('st'))||[{t:"12:00",x:"Сесть за учёбу",d:false}];
var tmr=null,alIdx=null,dis={};
document.getElementById('nb').value=localStorage.getItem('sn')||'';

function tab(n){
document.getElementById('vp').style.display=n?'none':'block';
document.getElementById('vn').style.display=n?'block':'none';
document.getElementById('tp').className='tab'+(n?'':' active');
document.getElementById('tn').className='tab'+(n?' active':'');
}
function mood(i){
stopT();
document.getElementById('q').innerText=rep[i][Math.floor(Math.random()*2)];
document.getElementById('trow').style.display='flex';
}
function timer(s){
stopT();
var r=document.getElementById('trow');
document.getElementById('q').innerText="🔥 Погнали! Не отвлекайся!";
r.innerHTML='<button class="t-btn" id="at" onclick="stopT()"></button>';
updT(s);
tmr=setInterval(function(){
s--;updT(s);
if(s<=0){stopT();document.getElementById('q').innerText="🏆 Отлично! Сделай перерыв 5 минут.";}
},1000);
}
function updT(s){
var b=document.getElementById('at');
if(b)b.innerText='⏳ '+('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)+' (стоп)';
}
function stopT(){
if(tmr){clearInterval(tmr);tmr=null;}
document.getElementById('trow').innerHTML='<button class="t-btn" onclick="timer(300)">⏱ 5 мин</button><button class="t-btn" style="background:#818cf8" onclick="timer(1500)">🍅 25 мин</button>';
}
function render(){
var ul=document.getElementById('list');ul.innerHTML='';
tasks.sort(function(a,b){return a.t.localeCompare(b.t);});
var dn=0;
for(var i=0;i<tasks.length;i++){
if(tasks[i].d)dn++;
var li=document.createElement('li');
if(tasks[i].d)li.className='done';
li.innerHTML='<div class="t-info" onclick="tog('+i+')"><b style="color:#38bdf8">'+tasks[i].t+'</b><span>'+tasks[i].x+'</span></div><button class="del" onclick="del('+i+')">✕</button>';
ul.appendChild(li);
}
document.getElementById('prog').innerText=dn+'/'+tasks.length;
localStorage.setItem('st',JSON.stringify(tasks));
}
function add(){
var t=document.getElementById('tt').value.trim(),x=document.getElementById('ti').value.trim();
if(!x)return;
if(t.length===4&&t.indexOf(':')===-1)t=t.slice(0,2)+':'+t.slice(2);
tasks.push({t:t||"12:00",x:x,d:false});
document.getElementById('ti').value='';
render();chk();
}
function tog(i){tasks[i].d=!tasks[i].d;render();chk();}
function del(i){tasks.splice(i,1);render();chk();}
function chk(){
var n=new Date(),cs=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
document.getElementById('clk').innerText=cs;
var f=null;
for(var i=0;i<tasks.length;i++){
if(!tasks[i].d&&tasks[i].t===cs&&!dis[tasks[i].t+tasks[i].x])f=i;
}
if(f!==null&&alIdx!==f){
stopT();alIdx=f;
document.getElementById('q').innerText="🚨 ВРЕМЯ ("+tasks[f].t+")! Пора учить: "+tasks[f].x;
document.getElementById('mbox').className='box alarm';
document.getElementById('abtn').style.display='block';
document.getElementById('mbtns').style.display='none';
document.getElementById('trow').style.display='none';
}else if(f===null&&alIdx!==null)ack();
}
function ack(){
if(alIdx!==null)dis[tasks[alIdx].t+tasks[alIdx].x]=true;
alIdx=null;
document.getElementById('mbox').className='box';
document.getElementById('abtn').style.display='none';
document.getElementById('mbtns').style.display='flex';
document.getElementById('q').innerText="Продуктивной учёбы!";
}
render();chk();setInterval(chk,5000);
</script>
</body>
</html>
