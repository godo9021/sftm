<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ХимЛаб</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d0b;color:#ecfdf5;font-family:sans-serif;padding:4px}
.card{max-width:420px;margin:0 auto;background:#0f1f1b;border-radius:12px;padding:10px;border:1px solid #1e3a32}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:13px;font-weight:bold;color:#10b981}
.badge{font-size:11px;font-weight:bold;color:#34d399;background:#060d0b;padding:2px 6px;border-radius:5px}
.box{background:#060d0b;border-radius:8px;padding:8px;margin-bottom:8px;border:1px solid #132a24}
.box.alarm{background:#059669}
.quote{font-size:12px;line-height:1.3;margin-bottom:8px;color:#d1fae5}
.row{display:flex;gap:4px;margin-bottom:6px}
button{border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.m-btn{flex:1;background:#0f1f1b;color:#a7f3d0;border:1px solid #1e3a32;padding:6px 2px;font-size:10px}
.t-btn{flex:1;background:#10b981;color:#060d0b;padding:6px;font-size:11px}
.ack-btn{width:100%;background:#ecfdf5;color:#065f46;padding:6px;font-size:11px;display:none}
.tab{flex:1;background:#060d0b;color:#6ee7b7;padding:6px;font-size:11px}
.tab.active{background:#10b981;color:#060d0b}
.sub-tab{flex:1;background:#060d0b;color:#6ee7b7;border:1px solid #1e3a32;padding:4px;font-size:10px}
.sub-tab.active{background:#38bdf8;color:#060d0b}
input{background:#060d0b;border:1px solid #1e3a32;color:#ecfdf5;padding:6px;border-radius:6px;font-size:12px;min-width:0}
.in-time{width:50px;text-align:center}
.in-text{flex:1}
.add-btn{background:#10b981;color:#060d0b;width:28px;font-size:16px}
ul{list-style:none;max-height:150px;overflow-y:auto}
li{display:flex;justify-content:space-between;align-items:center;padding:6px;background:#060d0b;border-radius:6px;margin-bottom:4px;font-size:12px;border-left:3px solid #10b981}
li.done{opacity:0.4;text-decoration:line-through}
.t-info{flex:1;display:flex;gap:6px;cursor:pointer;overflow:hidden}
.del{background:none;color:#f87171;font-size:13px;padding:0 4px}
textarea{width:100%;height:110px;background:#060d0b;border:1px solid #1e3a32;border-radius:8px;color:#ecfdf5;padding:8px;font-size:12px;resize:none}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div class="title">🧪 ХимЛаб-Трекер</div>
<div><span class="badge" id="prog">0/0</span> <span class="badge" id="clk">00:00</span></div>
</div>
<div class="box" id="mbox">
<div class="quote" id="q">Реакция не пойдёт без энергии активации. Жми на колбу!</div>
<div class="row" id="mbtns">
<button class="m-btn" onclick="mood(0)">😴 Лень</button>
<button class="m-btn" onclick="mood(1)">📱 Залип</button>
<button class="m-btn" onclick="mood(2)">🤯 Сложно</button>
<button class="m-btn" onclick="mood(3)">⚗️ Отдых</button>
</div>
<div class="row" id="trow" style="display:none">
<button class="t-btn" onclick="timer(300)">🔥 5 мин</button>
<button class="t-btn" style="background:#38bdf8" onclick="timer(1500)">☢️ 25 мин</button>
</div>
<button class="ack-btn" id="abtn" onclick="ack()">✅ Запускаю реакцию!</button>
</div>
<div class="row">
<button class="tab active" id="tp" onclick="tab(0)">📅 План</button>
<button class="tab" id="tn" onclick="tab(1)">🧬 Журнал</button>
</div>
<div id="vp">
<div class="row">
<input class="in-time" id="tt" value="12:00" maxlength="5">
<input class="in-text" id="ti" placeholder="Реакция или предмет...">
<button class="add-btn" onclick="add()">+</button>
</div>
<ul id="list"></ul>
</div>
<div id="vn" style="display:none">
<div class="row">
<button class="sub-tab active" id="st0" onclick="subTab(0)">🧪 ДЗ</button>
<button class="sub-tab" id="st1" onclick="subTab(1)">⚗️ Формулы</button>
<button class="sub-tab" id="st2" onclick="subTab(2)">☢️ Шпоры</button>
</div>
<textarea id="nb" placeholder="Пиши сюда уравнения или ДЗ..." oninput="saveNote()"></textarea>
</div>
</div>
<script>
var rep=[
["Ты сейчас как Гелий — ни с чем не реагируешь. Дай 5 мин энергии активации!","Энтропия сама только растёт. Нужна энергия извне. Вставай!","Эффект Зейгарник: начни одну цепочку — дальше пойдёт само!"],
["Телефон как H2SO4 — обугливает твоё время. Убери на 25 минут!","В ленте мемов диплом не выдают! Клади смартфон экраном вниз.","Соцсети отравляют катализатор твоей концентрации. Закрывай!"],
["Метод Фейнмана: объясни реакцию так, будто рассказываешь первокласснику.","Не глотай всю органику разом — выучи один гомологический ряд.","Закрой тетрадь и напиши 3 формулы по памяти. Это качает нейроны!"],
["Правило 20-20-20: каждые 20 мин смотри вдаль на 20 сек. Береги глаза!","Скроллинг НЕ даёт мозгу отдохнуть. Полежи 5 мин с закрытыми глазами.","Сделай 15 приседаний — приток O2 даст мозгу чистый АТФ без энергетиков!"]
];
var tasks=JSON.parse(localStorage.getItem('st'))||[{t:"12:00",x:"Сесть за химию",d:false}];
var notes=JSON.parse(localStorage.getItem('sn_sec'))||["","",""];
var curSec=0,tmr=null,alIdx=null,dis={};
document.getElementById('nb').value=notes||'';
function tab(n){document.getElementById('vp').style.display=n?'none':'block';document.getElementById('vn').style.display=n?'block':'none';document.getElementById('tp').className='tab'+(n?'':' active');document.getElementById('tn').className='tab'+(n?' active':'');}
function subTab(s){curSec=s;for(var i=0;i<3;i++)document.getElementById('st'+i).className='sub-tab'+(i===s?' active':'');document.getElementById('nb').value=notes[s]||'';}
function saveNote(){notes[curSec]=document.getElementById('nb').value;localStorage.setItem('sn_sec',JSON.stringify(notes));}
function mood(i){stopT();var a=rep[i];document.getElementById('q').innerText=a[Math.floor(Math.random()*a.length)];document.getElementById('trow').style.display='flex';}
function timer(s){stopT();var r=document.getElementById('trow');document.getElementById('q').innerText=(s===1500)?"☢️ Синтез: 25 мин фокуса!":"🔥 Энергия активации: 5 мин!";r.innerHTML='<button class="t-btn" id="at" onclick="stopT()"></button>';updT(s);tmr=setInterval(function(){s--;updT(s);if(s<=0){stopT();document.getElementById('q').innerText="🏆 Реакция прошла на 100%!";}},1000);}
function updT(s){var b=document.getElementById('at');if(b)b.innerText='⏳ '+('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)+' (стоп)';}
function stopT(){if(tmr){clearInterval(tmr);tmr=null;}document.getElementById('trow').innerHTML='<button class="t-btn" onclick="timer(300)">🔥 5 мин</button><button class="t-btn" style="background:#38bdf8" onclick="timer(1500)">☢️ 25 мин</button>';}
function render(){var ul=document.getElementById('list');ul.innerHTML='';tasks.sort(function(a,b){return a.t.localeCompare(b.t);});var dn=0;for(var i=0;i<tasks.length;i++){if(tasks[i].d)dn++;var li=document.createElement('li');if(tasks[i].d)li.className='done';li.innerHTML='<div class="t-info" onclick="tog('+i+')"><b style="color:#10b981">'+tasks[i].t+'</b><span>'+tasks[i].x+'</span></div><button class="del" onclick="del('+i+')">✕</button>';ul.appendChild(li);}document.getElementById('prog').innerText=dn+'/'+tasks.length;localStorage.setItem('st',JSON.stringify(tasks));}
function add(){var t=document.getElementById('tt').value.trim(),x=document.getElementById('ti').value.trim();if(!x)return;if(t.length===4&&t.indexOf(':')===-1)t=t.slice(0,2)+':'+t.slice(2);tasks.push({t:t||"12:00",x:x,d:false});document.getElementById('ti').value='';render();chk();}
function tog(i){tasks[i].d=!tasks[i].d;render();chk();}
function del(i){tasks.splice(i,1);render();chk();}
function chk(){var n=new Date(),cs=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);document.getElementById('clk').innerText=cs;var f=null;for(var i=0;i<tasks.length;i++){if(!tasks[i].d&&tasks[i].t===cs&&!dis[tasks[i].t+tasks[i].x])f=i;}if(f!==null&&alIdx!==f){stopT();alIdx=f;document.getElementById('q').innerText="🚨 ВРЕМЯ ("+tasks[f].t+")! Запускай: "+tasks[f].x;document.getElementById('mbox').className='box alarm';document.getElementById('abtn').style.display='block';document.getElementById('mbtns').style.display='none';document.getElementById('trow').style.display='none';}else if(f===null&&alIdx!==null)ack();}
function ack(){if(alIdx!==null)dis[tasks[alIdx].t+tasks[alIdx].x]=true;alIdx=null;document.getElementById('mbox').className='box';document.getElementById('abtn').style.display='none';document.getElementById('mbtns').style.display='flex';document.getElementById('q').innerText="Катализатор сработал!";}
render();chk();setInterval(chk,5000);
</script>
</body>
</html>
